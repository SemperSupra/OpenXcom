# Public CI surface for the reviewed compile-observer candidate.
name: Compile observer candidate

on:
  push:
    branches:
      - semper/compile-observer
  pull_request:
    branches:
      - semper/oxce-8.6.5-base
  workflow_dispatch:

jobs:
  observer-contract:
    name: Observer contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile smoke test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tests/CompileObserverSmoke.cpp \
            tests/CompileObserverCrossTu.cpp \
            -o /tmp/compile-observer-smoke

      - name: Run smoke test
        run: /tmp/compile-observer-smoke

  linux-engine-build:
    name: Full Linux engine build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OXCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install \
            libsdl1.2-dev \
            libsdl-mixer1.2-dev \
            libsdl-image1.2-dev \
            libsdl-gfx1.2-dev

      - name: Configure OXCE
        run: cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile full OXCE engine
        run: make -j$(nproc)
